[project]
name = "neuorks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "scarabush_scarabush" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
]

[project.scripts]
neuorks = "neuorks:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
